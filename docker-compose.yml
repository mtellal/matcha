services:

  frontend: 
    build:
      context: ./frontend
    volumes:
      - ./frontend:/usr/src/app
    environment:
      - PORT=${FRONT_PORT}
      - REACT_APP_BACK_PORT=443
      - REACT_APP_BACK_DOMAIN=matcha.mezyann.fr
    ports:
      - ${FRONT_PORT}:${FRONT_PORT}

  backend:
    build:
      context: ./backend
    volumes: 
      - ./backend:/usr/src/app
    ports:
      - 3000:3000
    env_file:
      - ./backend/.env
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    build:
      context: ./mariadb.config
    restart: always
    volumes:
      - ./mariadb:/var/lib/mysql
    env_file:
      - ./backend/.env
    healthcheck:
      test: "mariadb -u$$MARIADB_USER -p$$MARIADB_ROOT_PASSWORD -e 'SELECT 1;'"
      interval: 2s
      timeout: 5s
      retries: 10
